<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Calculadoras financeiras</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A4A"/>
      <stop offset="1" stop-color="#0F6B6B"/>
    </linearGradient>
    <linearGradient id="calc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DCE6EF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="130" fill="#fff" opacity="0.05"/>

  <!-- Calculadora -->
  <g filter="url(#shadow)">
    <rect x="136" y="84" width="240" height="344" rx="30" fill="url(#calc)"/>
  </g>

  <!-- Tela com gráfico -->
  <rect x="160" y="108" width="192" height="88" rx="14" fill="#0B2A4A"/>
  <g fill="url(#bar)">
    <rect x="182" y="164" width="22" height="16" rx="4"/>
    <rect x="212" y="152" width="22" height="28" rx="4"/>
    <rect x="242" y="156" width="22" height="24" rx="4"/>
    <rect x="272" y="140" width="22" height="40" rx="4"/>
    <rect x="302" y="126" width="22" height="54" rx="4"/>
  </g>
  <polyline points="193,152 223,140 253,144 283,128 313,114" fill="none" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="313" cy="114" r="6" fill="#FCD34D"/>

  <!-- Teclas -->
  <g>
    <rect x="160" y="214" width="56" height="44" rx="11" fill="#FFFFFF"/>
    <rect x="228" y="214" width="56" height="44" rx="11" fill="#FFFFFF"/>
    <rect x="296" y="214" width="56" height="44" rx="11" fill="#C7D7E6"/>
    <rect x="160" y="270" width="56" height="44" rx="11" fill="#FFFFFF"/>
    <rect x="228" y="270" width="56" height="44" rx="11" fill="#FFFFFF"/>
    <rect x="296" y="270" width="56" height="44" rx="11" fill="#C7D7E6"/>
    <rect x="160" y="326" width="56" height="44" rx="11" fill="#FCD34D"/>
    <rect x="228" y="326" width="56" height="44" rx="11" fill="#FFFFFF"/>
    <rect x="296" y="326" width="56" height="44" rx="11" fill="#C7D7E6"/>
    <rect x="160" y="382" width="192" height="32" rx="10" fill="#059669"/>
    <rect x="240" y="392" width="32" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="240" y="401" width="32" height="5" rx="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Selo de porcentagem -->
  <g filter="url(#shadow)">
    <circle cx="388" cy="388" r="66" fill="#FCD34D"/>
  </g>
  <circle cx="388" cy="388" r="53" fill="none" stroke="#B45309" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="388" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" fill="#0B2A4A">%</text>
</svg>
